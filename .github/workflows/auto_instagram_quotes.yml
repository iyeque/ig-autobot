name: Auto Instagram Quote Poster

on:
  schedule:
    - cron: "0 2,6,10,18,22 * * *" # 5x/day: 02:00, 06:00, 10:00, 18:00, 22:00 UTC (avoids main IG at 13:00)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  post:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync remote state
        run: git pull --no-rebase origin master

      - name: Generate Quote Image
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/publish_instagram_quotes.py --generate-only

      - name: Setup Pages (Deployment)
        uses: actions/configure-pages@v5

      - name: Create _site
        run: |
          mkdir -p _site/images _site/reels _site/carousel
          cp -r images/* _site/images/ 2>/dev/null || true
          cp -r reels/* _site/reels/ 2>/dev/null || true
          [ -f output.jpg ] && cp output.jpg _site/images/output.jpg || true
          [ -f reel.mp4 ] && cp reel.mp4 _site/reels/reel.mp4 || true
          [ -f story.jpg ] && cp story.jpg _site/images/story.jpg || true
          [ -d carousel ] && cp -r carousel/* _site/carousel/ || true
          [ -f carousel.json ] && cp carousel.json _site/carousel.json || true
          [ -f _headers ] && cp _headers _site/_headers || true
          # Deploy generated quote image to Pages
          [ -f images/quote_post.jpg ] && cp images/quote_post.jpg _site/images/quote_post.jpg || true
          echo "=== _site/images/ contents ==="
          ls -la _site/images/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wait for CDN
        run: sleep 30

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/publish_instagram_quotes.py --publish-only

      - name: Commit quotes state
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add -f quotes_state.json || true
          git commit -m "Instagram: quote post [skip ci]" || true
          git push origin master || (sleep 5 && git pull --no-rebase origin master && git push)
