name: Master Quote Publisher (IG)
on:
  workflow_dispatch:
  schedule:
    - cron: '10 12 * * *'  # 12:10 UTC = 16:10 GST

permissions:
  contents: write

concurrency:
  group: master-quote
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest
        run: git pull --rebase origin master

      - name: Publish quote (Instagram)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
        run: python scripts/agent_publisher.py --brand main --format quote --platforms instagram

      - name: Commit state changes
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: publish quote state [skip ci]"
          git push origin master || (sleep 5 && git pull --rebase origin master && git push origin master)
