name: Auto Wilma LinkedIn

on:
  schedule:
    - cron: "0 9 * * *" # Daily at 9 AM UTC
  workflow_dispatch:

jobs:
  wilma-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Wilma Bot
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
        run: python forwilma/wilma_bot.py

      - name: Commit and Push Assets
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          python scripts/generate_gallery_json.py
          git add -f forwilma/state.json forwilma/images/ gallery.json
          git commit -m "Wilma LinkedIn update [skip ci]" || echo "No changes"
          git pull --rebase origin master
          git push origin master

      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.WILMA_LINKEDIN_TOKEN }}
          LINKEDIN_URN: ${{ secrets.WILMA_LINKEDIN_URN }}
        run: |
          # Run from inside the directory so it finds the local caption.txt and output.jpg
          cd forwilma
          python publish_wilma.py
