name: Auto Wilma LinkedIn Poster

on:
  schedule:
    - cron: "0 9 * * *" # Daily at 9 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare Assets
        run: python scripts/prepare_assets.py --platform linkedin --bundle forwilma/wilma_bundle.json

      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.WILMA_LINKEDIN_TOKEN }}
          LINKEDIN_URN: ${{ secrets.WILMA_LINKEDIN_URN }}
        run: python forwilma/publish_wilma_linkedin.py
