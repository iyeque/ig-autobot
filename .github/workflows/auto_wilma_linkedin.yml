name: Auto Wilma LinkedIn

on:
  schedule:
    - cron: "0 9 * * *" # Daily at 9 AM UTC
  workflow_dispatch:

jobs:
  wilma-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Wilma Bot
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
        run: python forwilma/wilma_bot.py

      - name: Commit state and archived images
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add forwilma/state.json forwilma/images/ forwilma/reels/
          git commit -m "Wilma Day update [skip ci]" || echo "No changes"
          git push

      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.WILMA_LINKEDIN_TOKEN }}
          LINKEDIN_URN: ${{ secrets.WILMA_LINKEDIN_URN }}
        run: |
          # We use the existing LinkedIn publishing script
          # but we ensure it uses the caption.txt and output.jpg generated by Wilma's bot
          python scripts/publish_linkedin.py
