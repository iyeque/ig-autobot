name: Auto Wilma LinkedIn Poster

on:
  schedule:
    - cron: "30 16 * * *" # Daily at 16:30 UTC (8:30 PM GST)
  workflow_dispatch:

concurrency:
  group: wilma-linkedin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync remote state
        run: git pull --no-rebase origin master

      - name: Prepare Assets
        run: python scripts/prepare_assets.py --platform linkedin --state_path forwilma/state.json

      - name: Ensure Wilma queue if missing
        run: |
          if [ ! -s forwilma/state.json ]; then
            echo "Wilma state.json missing — running generator."
          elif [ -f .wilma_generated_today ]; then
            echo "Wilma generator already ran today. Skipping inline generation."
            exit 0
          else
            python - <<'PY'
            import json
            from pathlib import Path
            state = json.loads(Path('forwilma/state.json').read_text(encoding='utf-8'))
            q = state.get('content_queue') or []
            ab = state.get('active_bundle')
            if q or (isinstance(ab, dict) and ab.get('post_id')):
                print('Wilma queue has content. Skipping inline generation.')
                exit(0)
            print('Wilma queue empty — running generator.')
            PY
          fi
          if [ -f .wilma_generated_today ]; then
            exit 0
          fi
          python forwilma/wilma_bot.py --mode generate_all
          date -u +%Y-%m-%d > .wilma_generated_today

      - name: Publish to LinkedIn
        env:
          WILMA_LINKEDIN_REFRESH_TOKEN: ${{ secrets.WILMA_LINKEDIN_REFRESH_TOKEN }}
          WILMA_LINKEDIN_CLIENT_ID: ${{ secrets.WILMA_LINKEDIN_CLIENT_ID }}
          WILMA_LINKEDIN_CLIENT_SECRET: ${{ secrets.WILMA_LINKEDIN_CLIENT_SECRET }}
          WILMA_LINKEDIN_URN: ${{ secrets.WILMA_LINKEDIN_URN }}
        run: python forwilma/publish_wilma_linkedin.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add -A || true
          git add -f forwilma/output.jpg forwilma/temp_output.jpg forwilma/images/ forwilma/caption.txt || true
          git commit -m "Wilma: LinkedIn publish + generated assets [skip ci]" || true
          git push origin master || (sleep 5 && git pull --no-rebase origin master && git checkout --ours forwilma/state.json || true && git add forwilma/state.json forwilma/images/ forwilma/temp_output.jpg forwilma/output.jpg || true && git commit -m "resolve state.json merge" && git push origin master)
