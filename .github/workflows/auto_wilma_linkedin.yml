name: Auto Wilma LinkedIn Poster

on:
  schedule:
    - cron: "0 9 * * *" # Daily at 9 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare Assets
        run: python scripts/prepare_assets.py --platform linkedin --state_path forwilma/state.json

      - name: Publish to LinkedIn
        env:
          WILMA_LINKEDIN_TOKEN: ${{ secrets.WILMA_LINKEDIN_TOKEN }}
          WILMA_LINKEDIN_URN: ${{ secrets.WILMA_LINKEDIN_URN }}
        run: python forwilma/publish_wilma_linkedin.py

      - name: Commit Wilma state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add forwilma/state.json
          git commit -m "Update Wilma state.json after LinkedIn post" || true
          git push || true
