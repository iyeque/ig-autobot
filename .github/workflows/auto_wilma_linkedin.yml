name: Auto Wilma LinkedIn Poster

on:
  schedule:
    - cron: "0 17 * * *" # Daily at 17:00 UTC
  workflow_dispatch:

concurrency:
  group: wilma-linkedin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync remote state
        run: git pull --rebase origin master

      - name: Generate Wilma assets
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          BOOK_TITLE: "Digital Guardian"
          BOOK_AUTHOR: "Wilma"
        run: python forwilma/wilma_bot.py --mode generate_all

      - name: Publish to LinkedIn
        env:
          WILMA_LINKEDIN_REFRESH_TOKEN: ${{ secrets.WILMA_LINKEDIN_REFRESH_TOKEN }}
          WILMA_LINKEDIN_CLIENT_ID: ${{ secrets.WILMA_LINKEDIN_CLIENT_ID }}
          WILMA_LINKEDIN_CLIENT_SECRET: ${{ secrets.WILMA_LINKEDIN_CLIENT_SECRET }}
          WILMA_LINKEDIN_URN: ${{ secrets.WILMA_LINKEDIN_URN }}
        run: python forwilma/publish_wilma_linkedin.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add forwilma/state.json forwilma/images/ forwilma/*.flag forwilma/caption.txt forwilma/output.jpg
          git commit -m "Wilma: LinkedIn publish + generated assets [skip ci]" || true
          git stash || true
          git pull --rebase origin master || true
          git stash pop || true
          git push origin master || (sleep 5 && git pull --rebase origin master && git push)
