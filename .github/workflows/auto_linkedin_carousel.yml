name: Auto LinkedIn Carousel Poster

on:
  schedule:
    - cron: "0 16 * * 3" # Wednesday at 16:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync remote state
        run: git pull --no-rebase origin master

      - name: Generate LinkedIn Carousel
        run: python scripts/generate_carousel_from_bundle.py --state_path state.json

      - name: Prepare Assets
        run: python scripts/prepare_assets.py --platform linkedin --state_path state.json

      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_URN: ${{ secrets.LINKEDIN_URN }}
        run: python scripts/publish_linkedin.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add -A || true
          git commit -m "LinkedIn: carousel post + assets [skip ci]" || true
          git push origin master || (sleep 5 && git pull --no-rebase origin master && git checkout --ours state.json || true && git add state.json && git commit -m "resolve state.json merge" && git push origin master)
