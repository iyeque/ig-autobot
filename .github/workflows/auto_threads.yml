name: Auto Threads Poster

on:
  schedule:
    - cron: "0 2,7,16,21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Content for Threads
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          BRAND_MODE: "true"
          STATIC_TEXT_OVERLAY: "true"
        run: python bot.py --platform threads

      - name: Commit and Push Assets
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          python scripts/generate_gallery_json.py
          git add -A
          git commit -m "Add Threads assets [skip ci]" || echo "No changes to commit"
          git stash
          git pull --rebase origin master
          git stash pop || echo "Nothing to pop"
          git push origin master

      - name: Wait for CDN propagation
        run: |
          echo "Waiting for GitHub Pages to deploy..."
          sleep 60 

      - name: Publish to Threads
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python scripts/publish_threads.py
