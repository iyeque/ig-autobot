name: Auto Threads Poster

on:
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  post:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare Assets
        id: prepare
        continue-on-error: true
        run: python scripts/prepare_assets.py --platform threads

      - name: Retry Prepare Assets
        continue-on-error: true
        if: steps.prepare.conclusion != 'success'
        run: python scripts/prepare_assets.py --platform threads

      - name: Setup Pages (Deployment)
        uses: actions/configure-pages@v5

      - name: Create _site
        run: |
          set -euo pipefail
          mkdir -p _site/images _site/reels
          cp -r images/* _site/images/ 2>/dev/null || true
          cp -r reels/* _site/reels/ 2>/dev/null || true
          for f in index.html PRIVACY.md gallery.json; do
            if [ -f "$f" ]; then
              cp "$f" _site/
            else
              echo "Warning: $f missing in repo root; skipping"
            fi
          done
          [ -f output.jpg ] && cp output.jpg _site/images/output.jpg || true
          [ -f reel.mp4 ] && cp reel.mp4 _site/reels/reel.mp4 || true
          [ -f story.jpg ] && cp story.jpg _site/images/story.jpg || true
          ls -la _site/images _site/reels _site || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Wait for CDN
        run: sleep 30

      - name: Publish to Threads
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python scripts/publish_threads.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "Update state.json after Threads post" || true
          git stash || true
          git pull --rebase origin master || true
          git stash pop || true
          git push origin master || (sleep 5 && git pull --rebase origin master && git push)
