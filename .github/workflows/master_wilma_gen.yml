name: Master Wilma Content Generation

on:
  schedule:
    - cron: "30 11 * * *" # Daily at 11:30 UTC (15:30 GST) before Wilma Bluesky
  workflow_dispatch:

permissions:
  contents: write
  # The chain step dispatches the publisher via the API, which the default
  # GITHUB_TOKEN cannot do without this — it fails with
  # "HTTP 403: Resource not accessible by integration".
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Orchestrate content (multi-agent, Wilma)
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
        run: python scripts/agent_orchestrator.py --brand wilma
        # NOTE: orchestrator enriches captions via agents AFTER wilma_bot
        # generates the bundle+image. Disabled for now — wilma_bot's
        # queue-based flow would double-generate. Re-enable in Phase 3
        # when publisher handles Wilma end-to-end.
        if: false

      - name: Generate Unified Assets (Wilma)
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          BOOK_TITLE: "Digital Guardian"
          BOOK_AUTHOR: "Wilma"
        run: python forwilma/wilma_bot.py --mode generate_all

      - name: Backfill captions
        run: python update_bundles.py

      - name: Sync and push assets
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git stash push -m "wilma-gen-ci" --include-untracked
          git pull --rebase origin master
          # `git stash pop` leaves conflict markers in state.json when the
          # incoming commit also touched it — that is what tripped the
          # publisher's conflict-marker guard and failed the run. Prefer the
          # freshly generated state on conflict instead of writing markers.
          git stash pop || {
            echo "::warning::stash pop conflicted — resolving in favour of generated state"
            git checkout --theirs -- state.json forwilma/state.json 2>/dev/null || true
            git checkout --ours -- state.json forwilma/state.json 2>/dev/null || true
            git add state.json forwilma/state.json 2>/dev/null || true
            git stash drop 2>/dev/null || true
          }
          # Never let conflict markers reach a commit.
          if grep -q '<<<<<<<' state.json forwilma/state.json 2>/dev/null; then
            echo "::error::conflict markers in state files after stash pop"
            exit 1
          fi
          git add -A
          git diff --cached --quiet || git commit -m "chore: wilma bundle daily assets for syndication [skip ci]"
          git push origin master

      # Chain the publisher instead of relying on a second independent cron.
      # The gen cron is 11:30 UTC and the publish cron is 16:30 UTC, but the
      # GitHub scheduler delayed the gen by 6h22m on 2026-10-07 — it finished
      # at 18:01, 82 minutes AFTER the publisher had already fired on an empty
      # queue. Wilma silently skipped a day. Dispatching from here means the
      # publisher only runs once there is actually a bundle to publish.
      #
      # continue-on-error: a dispatch failure must not fail the job. On
      # 2026-10-08 the main gen hit HTTP 403 (missing actions:write) after
      # generating and pushing, and the non-zero exit discarded the bundle.
      # The scheduled publish cron is still the safety net.
      - name: Trigger Wilma publisher
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run wilma_publish.yml --ref master \
            || echo "::warning::publisher dispatch failed; the scheduled publish cron will pick this up"
