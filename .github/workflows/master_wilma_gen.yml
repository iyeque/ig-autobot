name: Master Wilma Content Generation

on:
  schedule:
    - cron: "30 11 * * *" # Daily at 11:30 UTC (15:30 GST) before Wilma Bluesky
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Unified Assets (Wilma)
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          BOOK_TITLE: "Digital Guardian"
          BOOK_AUTHOR: "Wilma"
        run: python forwilma/wilma_bot.py --mode generate_all

      - name: Backfill captions
        run: python update_bundles.py

      - name: Sync and push assets
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git stash push -m "wilma-gen-ci" --include-untracked
          git pull --no-rebase origin master
          git stash pop || true
          git add -A
          git diff --cached --quiet || git commit -m "chore: wilma bundle daily assets for syndication [skip ci]"
          git push origin master
