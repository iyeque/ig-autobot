name: Master Wilma Content Generation

on:
  schedule:
    - cron: "0 3 * * 1,2,4,6" # Mon, Tue, Thu, Sat at 3 AM UTC (after main generator)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Unified Assets (Wilma)
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          BOOK_TITLE: "Digital Guardian"
          BOOK_AUTHOR: "Wilma"
        run: python forwilma/wilma_bot.py --mode generate_all

      - name: Backfill captions
        run: python update_bundles.py

      - name: Sync and push assets
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git fetch origin master
          git stash --include-untracked --message "wilma-gen-ci-stash" || true
          git reset --hard origin/master
          git stash pop || true
          git add -A || true
          git add -f forwilma/output.jpg forwilma/caption.txt || true
          git commit -m "Wilma: bundle daily assets [skip ci]" || echo "Nothing to commit"
          git push origin master
