name: Master Publisher
on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'  # 17:00 UTC = 21:00 GST

permissions:
  contents: write

concurrency:
  group: master-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest
        run: git fetch origin && git reset --hard origin/master

      - name: Enable IG Story for this post
        run: echo "post_amplifier" > post_story.flag

      - name: Publish (standard, all platforms)
        env:
          # Instagram (FB Graph API)
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          # LinkedIn
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_URN: ${{ secrets.LINKEDIN_URN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          # Threads
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          # Bluesky
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          # YouTube
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Pinterest
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python scripts/agent_publisher.py --brand main --format standard --allow-duplicate

      - name: Publish to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python scripts/publish_facebook.py

      - name: Commit state changes
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git add -f reels/reel.mp4 reels/reel_*.mp4 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: publish state [skip ci]"
          # Robust push with conflict resolution
          for attempt in 1 2 3; do
            if git push origin master; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt, resolving..."
            # Save publisher's state changes
            git stash --include-untracked 2>/dev/null || true
            # Take remote version of everything
            git fetch origin
            git reset --hard origin/master
            # Re-apply publisher's changes (state.json, reels, etc.)
            git stash pop 2>/dev/null || true
            # If state.json has conflict markers, take remote and re-apply publisher's posted-bundle updates
            if grep -q '<<<<<<<' state.json 2>/dev/null; then
              echo "Conflict in state.json, taking remote version"
              git checkout --theirs state.json 2>/dev/null || true
              git add state.json
            fi
            git add -A
            git add -f reels/reel.mp4 reels/reel_*.mp4 2>/dev/null || true
            git diff --cached --quiet || git commit -m "chore: publish state [skip ci] (retry $attempt)"
            sleep 5
          done
          echo "::error::Failed to push after 3 attempts"
          exit 1
