name: Master Content Generation

on:
  schedule:
    # Daily at 02:00 UTC, matching the daily publisher at 17:00 UTC.
    # Main now follows the same generate-then-publish-same-day flow as Wilma.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # The chain step dispatches the publisher via the API, which the default
  # GITHUB_TOKEN cannot do without this — it fails with
  # "HTTP 403: Resource not accessible by integration".
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Orchestrate content (multi-agent)
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/agent_orchestrator.py --brand main

      - name: Generate Unified Assets
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          BOOK_TITLE: "The Nine Stitches"
          BOOK_AUTHOR: "M.W.E. Wigman"
        run: python bot.py --mode generate_all

      - name: Backfill captions
        run: python update_bundles.py

      # NOTE: the PIL reel is built by bot.py (--mode generate_all), which
      # rotates templates and writes reels/reel_<timestamp>.mp4. Do NOT run
      # generate_reel.py here — a duplicate step used to overwrite bot.py's
      # output with a different rotation scheme. This step instead builds the
      # higher-quality HyperFrames reel under a SEPARATE filename that
      # publish.py:433 prefers when present. It runs BEFORE the publisher
      # chain so the improved reel actually exists at post time; the previous
      # standalone workflow rendered ~1h after the chained publisher and its
      # output was never used.
      - name: Render HyperFrames reel for this bundle
        continue-on-error: true
        run: |
          npm install hyperframes@0.7.70 --no-audit --no-fund
          POST_ID=$(python scripts/generate_hyperframes_reel.py --resolve-post-id)
          if [ -z "$POST_ID" ]; then
            echo "::warning::no post_id resolved; skipping HyperFrames reel (PIL reel from bot.py remains)"
            exit 0
          fi
          echo "Rendering HyperFrames reel for post_id=$POST_ID"
          python scripts/generate_hyperframes_reel.py --post_id "$POST_ID" --duration_s 9
          cd hyperframes/compositions
          mkdir -p ../../reels
          npx hyperframes render -c "bundle-${POST_ID}.html" --output "../../reels/reel_${POST_ID}_hyperframes.mp4"

      - name: Sync and push assets
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: bundle daily assets for syndication [skip ci]"
          # Retry once on a rejected push. The recovery used to `git add ...
          # flags/ ...`, but flags/ does not exist in the repo, so git aborted
          # with "fatal: pathspec 'flags/' did not match any files" and, under
          # bash -e, killed the step — the freshly generated bundle was never
          # pushed. `git add -A` after the rebase stages everything without
          # naming paths that may not exist.
          git push origin master || {
            sleep 5
            git pull --rebase origin master
            git add -A
            git diff --cached --quiet || git commit -m "chore: bundle daily assets (post-rebase) [skip ci]"
            git push origin master
          }

      # Chain the publisher instead of relying on a second independent cron.
      # The gen cron is 02:00 UTC and the publish cron is 17:00 UTC, but the
      # GitHub scheduler has delayed scheduled runs by 6+ hours (Wilma's gen
      # landed 6h22m late on 2026-10-07 and missed its publisher entirely).
      # Dispatching from here means the publisher only runs once there is
      # actually a bundle to publish.
      #
      # continue-on-error: a dispatch failure must not fail the job. On
      # 2026-10-08 this step hit HTTP 403 (missing actions:write) AFTER the
      # bundle was generated and pushed, and the non-zero exit discarded
      # bundle 320. The scheduled publish cron is still the safety net.
      - name: Trigger main publisher
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run master_publish.yml --ref master \
            || echo "::warning::publisher dispatch failed; the scheduled publish cron will pick this up"
