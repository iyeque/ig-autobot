name: Master Content Generation

on:
  schedule:
    - cron: "0 2 * * 1,2,4,6" # Mon, Tue, Thu, Sat at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate Unified Assets
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          BOOK_TITLE: "The Nine Stitches"
          BOOK_AUTHOR: "M.W.E. Wigman"
        run: python bot.py --mode generate_all

      - name: Backfill captions
        run: python update_bundles.py

      - name: "Generate Reel (rotate: hook_blast, cinematic_quote, word_ripple)"
        run: |
          python -c "
          import json
          with open('state.json') as f:
              state = json.load(f)
          active = state.get('active_bundle') or (state.get('content_queue', [{}])[0] if state.get('content_queue') else None)
          if not active:
              print('No active bundle, skipping reel')
              exit(0)
          post_id = active.get('post_id')
          if not post_id:
              print('No post_id, skipping reel')
              exit(0)
          # Rotation: 0=hook_blast, 1=cinematic_quote, 2=word_ripple
          template = ['hook_blast', 'cinematic_quote', 'word_ripple'][int(post_id) % 3]
          print(f'post_id={post_id} -> template={template}')
          import subprocess, sys
          r = subprocess.run([sys.executable, 'scripts/generate_reel.py', '--template', template, '--post_id', str(post_id)])
          sys.exit(r.returncode)
          "

      - name: Sync and push assets
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: bundle daily assets for syndication [skip ci]"
          git push origin master || (sleep 5 && git pull --no-rebase origin master && git checkout --ours state.json forwilma/state.json || true && git add state.json forwilma/state.json images/ reels/ flags/ carousel.json || true && git commit -m "resolve state merge" && git push origin master)
