name: Master Content Generation

on:
  schedule:
    - cron: "0 2 * * 4,0" # Thursday & Sunday at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Unified Assets
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          BOOK_TITLE: "The Nine Stitches"
          BOOK_AUTHOR: "M.W.E. Wigman"
        run: python bot.py --mode generate_all

      - name: Backfill captions
        run: python update_bundles.py

      - name: Sync and push assets
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add \
            state.json \
            captions_bundle.json \
            forwilma/state.json \
            images/ \
            images/carousel_* \
            reels/ \
            forwilma/images/ \
            post_reel.flag \
            post_story.flag \
            forwilma/*.flag \
            caption.txt \
            output.jpg \
            forwilma/caption.txt \
            forwilma/output.jpg
          git diff --cached --quiet || git commit -m "chore: bundle daily assets for syndication [skip ci]"
          git push origin master
