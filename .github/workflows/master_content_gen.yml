name: Master Content Generation

on:
  schedule:
    # Daily at 02:00 UTC, matching the daily publisher at 17:00 UTC.
    # Main now follows the same generate-then-publish-same-day flow as Wilma.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # The chain step dispatches the publisher via the API, which the default
  # GITHUB_TOKEN cannot do without this — it fails with
  # "HTTP 403: Resource not accessible by integration".
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Orchestrate content (multi-agent)
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
        run: python scripts/agent_orchestrator.py --brand main

      - name: Generate Unified Assets
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          BOOK_TITLE: "The Nine Stitches"
          BOOK_AUTHOR: "M.W.E. Wigman"
        run: python bot.py --mode generate_all

      - name: Backfill captions
        run: python update_bundles.py

      # NOTE: reel generation lives in bot.py (--mode generate_all), which
      # rotates templates via reel_rotation.json and builds the reel from the
      # bundle's own image. A duplicate step here used to run afterwards with a
      # different rotation scheme (post_id % 3), overwriting bot.py's output
      # and generating two reels per bundle.

      - name: Sync and push assets
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: bundle daily assets for syndication [skip ci]"
          git push origin master || (sleep 5 && git pull --rebase origin master && git checkout --ours state.json forwilma/state.json || true && git add state.json forwilma/state.json images/ reels/ flags/ carousel.json || true && git commit -m "resolve state merge" && git push origin master)

      # Chain the publisher instead of relying on a second independent cron.
      # The gen cron is 02:00 UTC and the publish cron is 17:00 UTC, but the
      # GitHub scheduler has delayed scheduled runs by 6+ hours (Wilma's gen
      # landed 6h22m late on 2026-10-07 and missed its publisher entirely).
      # Dispatching from here means the publisher only runs once there is
      # actually a bundle to publish.
      #
      # continue-on-error: a dispatch failure must not fail the job. On
      # 2026-10-08 this step hit HTTP 403 (missing actions:write) AFTER the
      # bundle was generated and pushed, and the non-zero exit discarded
      # bundle 320. The scheduled publish cron is still the safety net.
      - name: Trigger main publisher
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run master_publish.yml --ref master \
            || echo "::warning::publisher dispatch failed; the scheduled publish cron will pick this up"
