name: Auto Instagram Poster

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  post:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync remote state
        run: git pull --rebase origin master

      - name: Prepare Assets
        run: |
          python scripts/prepare_assets.py --platform instagram || \
          python scripts/prepare_assets.py --platform instagram

      - name: Setup Pages (Deployment)
        uses: actions/configure-pages@v5

      - name: Create _site
        run: |
          set -euo pipefail
          mkdir -p _site/images _site/reels
          cp -r images/* _site/images/ 2>/dev/null || true
          cp -r reels/* _site/reels/ 2>/dev/null || true
          for f in index.html PRIVACY.md gallery.json; do
            if [ -f "$f" ]; then
              cp "$f" _site/
            else
              echo "Warning: $f missing in repo root; skipping"
            fi
          done
          [ -f output.jpg ] && cp output.jpg _site/images/output.jpg || true
          [ -f reel.mp4 ] && cp reel.mp4 _site/reels/reel.mp4 || true
          [ -f story.jpg ] && cp story.jpg _site/images/story.jpg || true
          ls -la _site/images _site/reels _site || true

      - name: Build site assets for Pages (master only)
        if: github.ref == 'refs/heads/master'
        run: |
          [ -d _site ] || mkdir -p _site/images _site/reels
          cp -r images/* _site/images/ 2>/dev/null || true
          cp -r reels/* _site/reels/ 2>/dev/null || true
          for f in index.html PRIVACY.md gallery.json; do
            if [ -f "$f" ]; then
              cp "$f" _site/
            else
              echo "Warning: $f missing in repo root; skipping"
            fi
          done
          [ -f output.jpg ] && cp output.jpg _site/images/output.jpg || true
          [ -f reel.mp4 ] && cp reel.mp4 _site/reels/reel.mp4 || true
          [ -f story.jpg ] && cp story.jpg _site/images/story.jpg || true
          ls -la _site/images _site/reels _site || true

      - name: Upload artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wait for CDN
        if: github.ref == 'refs/heads/master'
        run: sleep 30

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/publish.py

      - name: Publish to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/publish_facebook.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add state.json images/ *.flag carousel.json || true
          git add -f output.jpg caption.txt || true
          git commit -m "Update state/assets after Instagram and Facebook posts" || true
          git stash || true
          git pull --rebase origin master || true
          git stash pop || true
          git push origin master || (sleep 5 && git pull --rebase origin master && git push)
