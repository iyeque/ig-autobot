name: Auto Instagram Poster

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate without posting to Instagram'
        required: false
        default: 'false'

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: instagram-post
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pillow PyPDF2

      - name: Ensure images directory exists
        run: |
          mkdir -p images
          if [ ! -f images/.gitkeep ]; then
            touch images/.gitkeep
          fi

      - name: Run bot to generate image + caption
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DEEPAI_API_KEY: ${{ secrets.DEEPAI_API_KEY }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          PDF_BOOK_FILENAME: ${{ secrets.PDF_BOOK_FILENAME }}
          BOOK_TITLE: "The Nine Stitches"
          BOOK_AUTHOR: "M.W.E. Wigman"
        run: |
          python bot.py

      - name: Commit state and posts
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add caption.txt state.json posts.json images/.gitkeep || true
          git commit -m "Update: caption, state, and posts [skip ci]" || echo "No changes"
          git push || echo "Push failed"

      - name: Verify outputs
        run: |
          if [ ! -f output.jpg ]; then
            echo "❌ Image not generated"
            ls -la
            exit 1
          fi
          if [ ! -f caption.txt ]; then
            echo "❌ Caption not generated"
            ls -la
            exit 1
          fi
          echo "✓ Outputs verified"

      - name: Move image with timestamp
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          IMAGE_NAME="post_${TIMESTAMP}.jpg"
          mv output.jpg "images/${IMAGE_NAME}"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "image_path=images/${IMAGE_NAME}" >> $GITHUB_ENV
          echo "✓ Image saved as ${IMAGE_NAME}"

      - name: Commit new image
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add images/
          git commit -m "Add Instagram image: ${{ env.image_name }} [skip ci]" || echo "No changes"
          git push || echo "Push failed"

      - name: Read caption
        id: caption
        run: |
          echo "caption<<EOF" >> $GITHUB_OUTPUT
          cat caption.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate image URL
        id: url
        run: |
          RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/${{ env.image_path }}"
          echo "url=$RAW_URL" >> $GITHUB_OUTPUT
          echo "Image URL: $RAW_URL"

      - name: Post to Instagram
        if: github.event.inputs.dry_run != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_URL: ${{ steps.url.outputs.url }}
          CAPTION: ${{ steps.caption.outputs.caption }}
        run: |
          for attempt in 1 2 3; do
            echo "Instagram post attempt $attempt/3..."
            
            # Create media container
            CREATE_RESPONSE=$(curl -s -X POST \
              "https://graph.facebook.com/v18.0/${IG_USER_ID}/media" \
              -F "image_url=${IMAGE_URL}" \
              -F "caption=${CAPTION}" \
              -F "access_token=${IG_ACCESS_TOKEN}")

            echo "Create response: $CREATE_RESPONSE"
            CREATION_ID=$(echo $CREATE_RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

            if [ -z "$CREATION_ID" ]; then
              echo "⚠️ No creation ID, waiting 30s..."
              sleep 30
              continue
            fi

            echo "Publishing creation ID: $CREATION_ID"
            
            # Publish media
            PUBLISH_RESPONSE=$(curl -s -X POST \
              "https://graph.facebook.com/v18.0/${IG_USER_ID}/media_publish" \
              -F "creation_id=${CREATION_ID}" \
              -F "access_token=${IG_ACCESS_TOKEN}")

            echo "Publish response: $PUBLISH_RESPONSE"
            
            if echo "$PUBLISH_RESPONSE" | grep -q '"id"'; then
              echo "✅ Successfully posted to Instagram"
              exit 0
            fi
            
            echo "⚠️ Publish failed, waiting 30s..."
            sleep 30
          done
          
          echo "❌ All Instagram attempts failed"
          exit 1

      - name: Prune old images (keep last 15)
        run: |
          cd images
          # Keep .gitkeep and 15 most recent images
          ls -t | grep -v '.gitkeep' | sed -e '1,15d' | xargs -I {} rm -f {} || true
          cd ..
          git add images/
          git commit -m "Prune old images [skip ci]" || echo "Nothing to prune"
          git push || echo "Push failed"