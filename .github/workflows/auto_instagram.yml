name: Auto Instagram Poster

on:
  schedule:
    - cron: "0 12,16,20,00 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate without posting to Instagram'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Validate required secrets
        run: |
          for secret in CEREBRAS_API_KEY AI_HORDE_API_KEY IG_USER_ID IG_ACCESS_TOKEN; do
            if [ -z "${!secret}" ]; then
              echo "❌ Missing required secret: $secret"
              exit 1
            fi
          done
          echo "✓ All required secrets are set"
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure directories exist
        run: |
          mkdir -p images
          mkdir -p reels
          mkdir -p _site
          if [ ! -f images/.gitkeep ]; then
            touch images/.gitkeep
          fi
          if [ ! -f reels/.gitkeep ]; then
            touch reels/.gitkeep
          fi

      - name: Run bot to generate image + caption
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          PDF_BOOK_FILENAME: ${{ secrets.PDF_BOOK_FILENAME }}
          BOOK_TITLE: "The Nine Stitches"
          BOOK_AUTHOR: "M.W.E. Wigman"
        run: python bot.py

      - name: Verify outputs
        run: |
          python scripts/verify_outputs.py

      - name: Move image with timestamp
        run: |
          if [ -f carousel.json ]; then
            echo "✓ Carousel images prepared by bot"
          else
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            IMAGE_NAME="post_${TIMESTAMP}.jpg"
            cp output.jpg "images/${IMAGE_NAME}"
            echo "✓ Image saved as ${IMAGE_NAME}"
          fi

          # Move story if generated
          if [ -f post_story.flag ] && [ -f story.jpg ]; then
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            STORY_NAME="story_${TIMESTAMP}.jpg"
            cp story.jpg "images/${STORY_NAME}"
            echo "✓ Story saved as ${STORY_NAME}"
          fi

          # Move reel if generated
          if [ -f post_reel.flag ] && [ -f reel.mp4 ]; then
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            REEL_NAME="reel_${TIMESTAMP}.mp4"
            cp reel.mp4 "reels/${REEL_NAME}"
            echo "✓ Reel saved as ${REEL_NAME}"
          fi

      - name: Commit state, posts, and images
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f caption.txt state.json posts.json images/ reels/
          git add -f post_story.flag post_reel.flag carousel.json || echo "No extra flags"
          git commit -m "Add post and update state [skip ci]" || echo "No changes"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Copy images to _site for Pages deployment
        run: |
          cp -r images _site/
          cp -r reels _site/
          echo "<!DOCTYPE html><html><head><title>The Nine Stitches</title></head><body><h1>Instagram Images</h1><p>Images for automated posting.</p></body></html>" > _site/index.html
          echo "✓ Prepared for GitHub Pages deployment"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish to Instagram
        if: github.event.inputs.dry_run != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python scripts/publish.py

      - name: Prune old images (keep last 30)
        if: always()
        run: |
          cd images
          ls -t | grep -v '.gitkeep' | sed -e '1,30d' | xargs -I {} rm -f {} || true
          cd ..
          cd reels
          ls -t | grep -v '.gitkeep' | sed -e '1,20d' | xargs -I {} rm -f {} || true
          cd ..
          git add -f images/
          git add -f reels/
          git commit -m "Prune old images [skip ci]" || echo "Nothing to prune"
          git push || echo "Push failed"
