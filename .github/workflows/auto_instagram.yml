name: Auto Instagram Poster

on:
  schedule:
    - cron: "0 12,16,20,00 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate without posting to Instagram'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pillow PyPDF2 dashscope

      - name: Ensure directories exist
        run: |
          mkdir -p images
          mkdir -p _site
          if [ ! -f images/.gitkeep ]; then
            touch images/.gitkeep
          fi

      - name: Run bot to generate image + caption
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DEEPAI_API_KEY: ${{ secrets.DEEPAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          PDF_BOOK_FILENAME: ${{ secrets.PDF_BOOK_FILENAME }}
          BOOK_TITLE: "The Nine Stitches"
          BOOK_AUTHOR: "M.W.E. Wigman"
        run: |
          python bot.py

      - name: Verify outputs
        run: |
          if [ ! -f output.jpg ]; then
            echo "❌ Image not generated"
            ls -la
            exit 1
          fi
          if [ ! -f caption.txt ]; then
            echo "❌ Caption not generated"
            ls -la
            exit 1
          fi
          echo "✓ Outputs verified"

      - name: Move image with timestamp
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          IMAGE_NAME="post_${TIMESTAMP}.jpg"
          mv output.jpg "images/${IMAGE_NAME}"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "image_path=images/${IMAGE_NAME}" >> $GITHUB_ENV
          echo "✓ Image saved as ${IMAGE_NAME}"

      - name: Commit state, posts, and image
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add caption.txt state.json posts.json images/
          git commit -m "Add post: ${{ env.image_name }} [skip ci]" || echo "No changes"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Copy images to _site for Pages deployment
        run: |
          cp -r images _site/
          echo "<!DOCTYPE html><html><head><title>The Nine Stitches</title></head><body><h1>Instagram Images</h1><p>Images for automated posting.</p></body></html>" > _site/index.html
          echo "✓ Prepared for GitHub Pages deployment"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wait for Pages deployment
        run: |
          echo "Waiting for Pages deployment to propagate..."
          sleep 10
          echo "✓ Pages should be live at ${{ steps.deployment.outputs.page_url }}"

      - name: Read caption (base64 encoded)
        id: caption
        run: |
          CAPTION_B64=$(base64 -w 0 caption.txt)
          echo "caption_b64=$CAPTION_B64" >> $GITHUB_OUTPUT

      - name: Post to Instagram with smart status check
        if: github.event.inputs.dry_run != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CAPTION_B64: ${{ steps.caption.outputs.caption_b64 }}
        run: |
          IMAGE_URL="https://iyeque.github.io/ig-autobot/${{ env.image_path }}"
          echo "Posting image: $IMAGE_URL"
          
          for attempt in 1 2 3; do
            echo ""
            echo "=== Instagram post attempt $attempt/3 ==="
            
            CAPTION=$(echo "$CAPTION_B64" | base64 -d)
            
            # Step 1: Create media container
            echo "Creating media container..."
            CREATE_RESPONSE=$(curl -s -X POST \
              "https://graph.facebook.com/v18.0/${IG_USER_ID}/media" \
              -F "image_url=${IMAGE_URL}" \
              -F "caption=${CAPTION}" \
              -F "access_token=${IG_ACCESS_TOKEN}")

            echo "Create response: $CREATE_RESPONSE"
            CREATION_ID=$(echo $CREATE_RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
            CREATE_ERROR=$(echo $CREATE_RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin).get('error',{}).get('message',''))")
            
            if [ -z "$CREATION_ID" ]; then
              echo "⚠️ Failed to create media: $CREATE_ERROR"
              if [ $attempt -lt 3 ]; then
                echo "Waiting 20s before retry..."
                sleep 20
              fi
              continue
            fi
            
            echo "✓ Media container created: $CREATION_ID"
            
            # Step 2: Smart wait - check status until ready
            echo "Checking media status..."
            READY=false
            MAX_CHECKS=6
            
            for check in $(seq 1 $MAX_CHECKS); do
              sleep 10
              
              STATUS_RESPONSE=$(curl -s -X GET \
                "https://graph.facebook.com/v18.0/${CREATION_ID}?fields=status_code&access_token=${IG_ACCESS_TOKEN}")
              
              echo "Status check $check/$MAX_CHECKS: $STATUS_RESPONSE"
              
              STATUS_CODE=$(echo $STATUS_RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin).get('status_code','UNKNOWN'))")
              
              case "$STATUS_CODE" in
                "FINISHED")
                  echo "✓ Media ready for publishing!"
                  READY=true
                  break
                  ;;
                "ERROR")
                  echo "✗ Media processing failed, will create new container..."
                  break
                  ;;
                "IN_PROGRESS"|"PENDING"|"UNKNOWN")
                  echo "⏳ Still processing..."
                  ;;
                *)
                  echo "? Unknown status: $STATUS_CODE"
                  ;;
              esac
            done
            
            if [ "$READY" != "true" ]; then
              echo "⚠️ Media not ready after ${MAX_CHECKS} checks, trying new container..."
              continue
            fi
            
            # Step 3: Publish media
            echo "Publishing media..."
            PUBLISH_RESPONSE=$(curl -s -X POST \
              "https://graph.facebook.com/v18.0/${IG_USER_ID}/media_publish" \
              -F "creation_id=${CREATION_ID}" \
              -F "access_token=${IG_ACCESS_TOKEN}")

            echo "Publish response: $PUBLISH_RESPONSE"
            
            PUB_ID=$(echo $PUBLISH_RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
            PUB_ERROR=$(echo $PUBLISH_RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin).get('error',{}).get('message',''))")
            
            if [ -n "$PUB_ID" ]; then
              echo "✅ Successfully posted to Instagram!"
              echo "Post ID: $PUB_ID"
              echo "Permalink: https://instagram.com/p/$PUB_ID"
              exit 0
            else
              echo "⚠️ Publish failed: $PUB_ERROR"
              if [ $attempt -lt 3 ]; then
                WAIT=$((15 + attempt * 10))
                echo "Waiting ${WAIT}s before retry..."
                sleep $WAIT
              fi
            fi
          done
          
          echo ""
          echo "❌ All Instagram attempts failed"
          echo "Image URL was: $IMAGE_URL"
          echo "Verify image manually: curl -I $IMAGE_URL"
          exit 1

      - name: Prune old images (keep last 15)
        if: always()
        run: |
          cd images
          ls -t | grep -v '.gitkeep' | sed -e '1,15d' | xargs -I {} rm -f {} || true
          cd ..
          git add images/
          git commit -m "Prune old images [skip ci]" || echo "Nothing to prune"
          git push || echo "Push failed"
