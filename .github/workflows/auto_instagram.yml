name: Auto Instagram Poster

on:
  schedule:
    - cron: "0 12,16,20,00,04,08 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate without posting to Instagram'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 50

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Validate required secrets
        run: |
          for secret in CEREBRAS_API_KEY AI_HORDE_API_KEY IG_USER_ID IG_ACCESS_TOKEN; do
            if [ -z "${!secret}" ]; then
              echo "❌ Missing required secret: $secret"
              exit 1
            fi
          done
          echo "✓ All required secrets are set"
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure directories exist
        run: |
          mkdir -p images
          mkdir -p reels
          mkdir -p _site
          if [ ! -f images/.gitkeep ]; then
            touch images/.gitkeep
          fi
          if [ ! -f reels/.gitkeep ]; then
            touch reels/.gitkeep
          fi

      - name: Run bot to generate image + caption
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          PDF_BOOK_FILENAME: ${{ secrets.PDF_BOOK_FILENAME }}
          BOOK_TITLE: "The Nine Stitches"
          BOOK_AUTHOR: "M.W.E. Wigman"
        run: python bot.py --platform instagram

      - name: Verify outputs
        run: |
          python scripts/verify_outputs.py

      - name: Move image with timestamp
        run: |
          if [ -f carousel.json ]; then
            echo "✓ Carousel images prepared by bot"
          else
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            IMAGE_NAME="post_${TIMESTAMP}.jpg"
            cp output.jpg "images/${IMAGE_NAME}"
            echo "✓ Image saved as ${IMAGE_NAME}"
          fi

          # Move story if generated
          if [ -f post_story.flag ] && [ -f story.jpg ]; then
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            STORY_NAME="story_${TIMESTAMP}.jpg"
            cp story.jpg "images/${STORY_NAME}"
            echo "✓ Story saved as ${STORY_NAME}"
          fi

          # Move reel if generated
          if [ -f post_reel.flag ] && [ -f reel.mp4 ]; then
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            REEL_NAME="reel_${TIMESTAMP}.mp4"
            cp reel.mp4 "reels/${REEL_NAME}"
            echo "✓ Reel saved as ${REEL_NAME}"
          fi

      - name: Commit and Push Assets
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          python scripts/generate_gallery_json.py
          git add -A
          git commit -m "Add post and update state [skip ci]" || echo "No changes to commit"
          git stash
          git pull --rebase origin master
          git stash pop || echo "Nothing to pop"
          git push origin master


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Copy images and index.html to _site
        run: |
          # Ensure _site is clean and ready
          rm -rf _site/*
          mkdir -p _site/images _site/reels
          
          # Copy everything from images/ and reels/ recursively
          # This ensures ANY new images committed to the repo are included
          cp -r images/* _site/images/
          cp -r reels/* _site/reels/
          
          cp index.html _site/
          cp PRIVACY.md _site/
          
          # Generate gallery.json using the new script
          python scripts/generate_gallery_json.py
          cp gallery.json _site/gallery.json
          echo "✓ Content synchronized to _site"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wait for CDN propagation
        run: |
          echo "Waiting for CDN to serve new images..."
          # Poll the site until the latest post image returns 200
          for i in {1..10}; do
            # Extract latest image URL from the images/ directory
            LATEST_IMAGE=$(ls -t images/post_*.jpg 2>/dev/null | head -n 1)
            if [ -z "$LATEST_IMAGE" ]; then
                echo "No post image found, checking carousel..."
                LATEST_IMAGE=$(ls -t images/*.jpg | head -n 1)
            fi
            
            # Construct the URL (matching logic in publish.py)
            URL="https://iyeque.github.io/ig-autobot/${LATEST_IMAGE}"
            echo "Polling $URL..."
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✓ CDN is live!"
              exit 0
            fi
            echo "Status $HTTP_CODE... retrying in 30s"
            sleep 30
          done
          echo "❌ Timed out waiting for CDN"
          exit 1

      - name: Publish to Instagram
        if: github.event.inputs.dry_run != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python scripts/publish.py

      - name: Publish to Facebook
        if: github.event.inputs.dry_run != 'true'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python scripts/publish_facebook.py

      - name: Prune old images (keep last 30)
        if: always()
        run: |
          cd images
          ls -t | grep -v '.gitkeep' | sed -e '1,30d' | xargs -I {} rm -f {} || true
          cd ..
          cd reels
          ls -t | grep -v '.gitkeep' | sed -e '1,20d' | xargs -I {} rm -f {} || true
          cd ..
          git add -f images/
          git add -f reels/
          git commit -m "Prune old images [skip ci]" || echo "Nothing to prune"
          git push || echo "Push failed"
