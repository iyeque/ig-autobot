name: Auto Bluesky Poster

on:
  schedule:
    - cron: "0 14 * * *" # Daily at 14:00 UTC (6 PM GST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare Assets
        run: python scripts/prepare_assets.py --platform bluesky

      - name: Publish to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: python scripts/publish_bluesky.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add state.json images/ *.flag carousel.json || true
          git add -f output.jpg caption.txt || true
          git commit -m "Update state/assets after Bluesky post" || true
          git stash || true
          git pull --rebase origin master || true
          git stash pop || true
          git push origin master || (sleep 5 && git pull --rebase origin master && git push)
