name: Master LinkedIn Carousel Publisher
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 3'  # Wednesday at 16:00 UTC = 20:00 GST

permissions:
  contents: write

concurrency:
  group: master-linkedin-carousel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest
        run: git fetch origin && git reset --hard origin/master

      - name: Publish carousel (LinkedIn)
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_URN: ${{ secrets.LINKEDIN_URN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: python scripts/agent_publisher.py --brand main --format carousel --platforms linkedin --allow-duplicate

      - name: Commit state changes
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: publish linkedin carousel state [skip ci]"
          for attempt in 1 2 3; do
            if git push origin master; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt, resolving..."
            git stash --include-untracked 2>/dev/null || true
            git fetch origin
            git reset --hard origin/master
            git stash pop 2>/dev/null || true
            if grep -q '<<<<<<<' state.json 2>/dev/null; then
              git checkout --theirs state.json 2>/dev/null || true
              git add state.json
            fi
            git add -A
            git diff --cached --quiet || git commit -m "chore: publish linkedin carousel state [skip ci] (retry $attempt)"
            sleep 5
          done
          echo "::error::Failed to push after 3 attempts"
          exit 1
