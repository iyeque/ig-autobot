name: Auto YouTube Poster

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt google-api-python-client google-auth-oauthlib

      - name: Prepare Assets
        run: python scripts/prepare_assets.py --platform youtube

      - name: Publish to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/publish_youtube.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "Update state.json after YouTube post" || true
          git stash || true
          git pull --rebase origin master || true
          git stash pop || true
          git push origin master || (sleep 5 && git pull --rebase origin master && git push)
