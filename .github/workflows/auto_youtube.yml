name: Auto YouTube Poster

on:
  schedule:
    - cron: "0 4,9,14,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-post
  cancel-in-progress: false

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Content for YouTube
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          BRAND_MODE: "true"
          STATIC_TEXT_OVERLAY: "true"
        run: python bot.py --platform youtube

      - name: Commit and Push Assets
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -f reels/ state.json posts.json
          git commit -m "Add YouTube assets [skip ci]" || echo "No changes"
          git push || echo "Push failed"

      - name: Publish to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/publish_youtube.py
