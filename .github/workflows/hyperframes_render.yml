name: HyperFrames Reel Render

on:
  # Manual re-render only. The daily render now happens inside
  # master_content_gen.yml BEFORE the publisher chain, so a separate
  # scheduled run was both redundant and ~1h too late to be used by the post.
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Bundle post_id to render (blank = active bundle)'
        required: false
        default: ''
jobs:
  render-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install HyperFrames
        run: npm install hyperframes@0.7.70 --no-audit --no-fund

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install jinja2

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Resolve post_id (input or active bundle)
        id: resolve-post
        env:
          INPUT_POST_ID: ${{ github.event.inputs.post_id }}
        run: |
          # Manual input wins; otherwise resolve the bundle awaiting publish
          # (shared with master_content_gen.yml). The old
          # platform_posted_bundles fallback picked an already-published id
          # and was ~1h too late for the post anyway.
          POST_ID="$INPUT_POST_ID"
          if [ -z "$POST_ID" ]; then
            POST_ID=$(python scripts/generate_hyperframes_reel.py --resolve-post-id)
          fi
          echo "post_id=$POST_ID" >> $GITHUB_OUTPUT
          echo "Rendering reel for post_id=$POST_ID"

      - name: Generate HyperFrames composition
        env:
          POST_ID: ${{ steps.resolve-post.outputs.post_id }}
        run: |
          python scripts/generate_hyperframes_reel.py --post_id "$POST_ID" --duration_s 9

      - name: Render MP4 with HyperFrames
        env:
          POST_ID: ${{ steps.resolve-post.outputs.post_id }}
        run: |
          cd hyperframes/compositions
          mkdir -p ../../reels
          npx hyperframes render -c bundle-${POST_ID}.html --output ../../reels/reel_${POST_ID}_hyperframes.mp4

      - name: Upload reel artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.resolve-post.outputs.post_id }}-hyperframes
          path: reels/reel_${{ steps.resolve-post.outputs.post_id }}_hyperframes.mp4
          retention-days: 14

      - name: Commit rendered reel back to repo
        env:
          POST_ID: ${{ steps.resolve-post.outputs.post_id }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          # Only commit the reel itself. NEVER `git add -A` here: npm install
          # creates node_modules/ in the repo root and staging it produces a
          # huge push that times out (HTTP 408).
          REEL=reels/reel_${POST_ID}_hyperframes.mp4
          cp "$REEL" /tmp/reel_backup.mp4
          git add -f "$REEL"
          git diff --cached --quiet || git commit -m "chore: HyperFrames reel for ${POST_ID} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin master; then echo "Reel pushed"; break; fi
            git fetch origin && git reset --hard origin/master
            mkdir -p reels && cp /tmp/reel_backup.mp4 "$REEL"
            git add -f "$REEL"
            git diff --cached --quiet || git commit -m "chore: HyperFrames reel for ${POST_ID} [skip ci] (retry $attempt)"
            sleep 5
          done
