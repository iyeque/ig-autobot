name: HyperFrames Reel Render

on:
  schedule:
    - cron: '0 17 * * *'  # Daily at 17:00 UTC (after content gen at 2 AM)
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Bundle post_id to render'
        required: true
        default: '3003'

jobs:
  render-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install HyperFrames
        run: npm install hyperframes@0.7.70 --no-audit --no-fund

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install jinja2

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Resolve active post_id from state.json
        id: resolve-post
        run: |
          POST_ID=$(python -c "
          import json
          s = json.load(open('state.json'))
          active = s.get('active_bundle') or {}
          if isinstance(active, dict) and active.get('post_id'):
              print(active['post_id'])
          else:
              # fallback: most recent ppb entry
              ppb = s.get('platform_posted_bundles', {})
              for platform in ['instagram', 'bluesky', 'linkedin']:
                  entries = ppb.get(platform, [])
                  if entries:
                      print(entries[-1])
                      break
              else:
                  print('3003')
          ")
          echo "post_id=$POST_ID" >> $GITHUB_OUTPUT

      - name: Generate HyperFrames composition
        env:
          POST_ID: ${{ steps.resolve-post.outputs.post_id }}
        run: |
          python scripts/generate_hyperframes_reel.py --post_id "$POST_ID" --duration_s 9

      - name: Render MP4 with HyperFrames
        env:
          POST_ID: ${{ steps.resolve-post.outputs.post_id }}
        run: |
          cd hyperframes/compositions
          mkdir -p ../../reels
          # Render frames using hyperframes screenshot (fast)
          npx hyperframes screenshot -c bundle-${POST_ID}.html --output ../../reels/reel_${POST_ID}_hyperframes.png --quality draft --fps 30 --duration 9
          # Composite to video with FFmpeg
          ffmpeg -y -framerate 30 -i ../../reels/reel_${POST_ID}_hyperframes_%03d.png -c:v libx264 -pix_fmt yuv420p -movflags +faststart ../../reels/reel_${POST_ID}_hyperframes.mp4

      - name: Upload reel artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.resolve-post.outputs.post_id }}-hyperframes
          path: reels/reel_${{ steps.resolve-post.outputs.post_id }}_hyperframes.mp4
          retention-days: 14

      - name: Commit rendered reel back to repo
        env:
          POST_ID: ${{ steps.resolve-post.outputs.post_id }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add -A || true
          git add -f reels/reel_${POST_ID}_hyperframes.mp4 || true
          git commit -m "Add HyperFrames reel for ${POST_ID}" || true
          git push origin master || (sleep 5 && git pull --no-rebase origin master && git push)
