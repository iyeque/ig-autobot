name: Master Carousel Publisher
on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *'  # 13:30 UTC = 17:30 GST

permissions:
  contents: write

concurrency:
  group: master-carousel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest
        run: git pull --rebase origin master

      - name: Publish carousel (IG + LinkedIn)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_USER_URN: ${{ secrets.LINKEDIN_USER_URN }}
        run: python scripts/agent_publisher.py --brand main --format carousel --platforms instagram,linkedin

      - name: Commit state changes
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: publish carousel state [skip ci]"
          git push origin master || (sleep 5 && git pull --rebase origin master && git push origin master)
