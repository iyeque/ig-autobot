name: Master Carousel Publisher
on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 1,3,5'  # Mon/Wed/Fri at 13:30 UTC = 17:30 GST

permissions:
  contents: write

concurrency:
  group: master-carousel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest
        run: git fetch origin && git reset --hard origin/master

      - name: Clear stale carousel (regenerate fresh every run)
        run: rm -f carousel.json

      - name: Enable IG Story for this post
        run: echo "post_amplifier" > post_story.flag

      - name: Publish carousel (IG)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python scripts/agent_publisher.py --brand main --format carousel --platforms instagram --allow-duplicate

      - name: Publish to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python scripts/prepare_assets.py --platform facebook --state_path state.json
          python scripts/publish_facebook.py

      - name: Commit state changes
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git add -f reels/reel.mp4 reels/reel_*.mp4 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: publish carousel state [skip ci]"
          for attempt in 1 2 3; do
            if git push origin master; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt, resolving..."
            git stash --include-untracked 2>/dev/null || true
            git fetch origin
            git reset --hard origin/master
            git stash pop 2>/dev/null || true
            if grep -q '<<<<<<<' state.json 2>/dev/null; then
              git checkout --theirs state.json 2>/dev/null || true
              git add state.json
            fi
            git add -A
            git add -f reels/reel.mp4 reels/reel_*.mp4 2>/dev/null || true
            git diff --cached --quiet || git commit -m "chore: publish carousel state [skip ci] (retry $attempt)"
            sleep 5
          done
          echo "::error::Failed to push after 3 attempts"
          exit 1
