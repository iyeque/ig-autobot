name: Master Carousel Publisher
on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 1,3,5'  # Mon/Wed/Fri at 13:30 UTC = 17:30 GST

permissions:
  contents: write

concurrency:
  group: master-carousel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest
        run: git pull --rebase --autostash origin master

      - name: Enable IG Story for this post
        run: echo "post_amplifier" > post_story.flag

      - name: Publish carousel (IG)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python scripts/agent_publisher.py --brand main --format carousel --platforms instagram

      - name: Publish to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python scripts/publish_facebook.py

      - name: Commit state changes
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: publish carousel state [skip ci]"
          git push origin master || (sleep 5 && git pull --rebase origin master && git push origin master)
