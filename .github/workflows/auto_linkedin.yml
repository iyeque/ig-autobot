name: Auto LinkedIn Poster

on:
  schedule:
    - cron: "0 14 * * *" # Daily at 2 PM UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyPDF2 python-dotenv pillow json-repair "moviepy<2.0.0"

      - name: Generate Content for LinkedIn
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          BRAND_MODE: "true"
          STATIC_TEXT_OVERLAY: "true"
        run: python bot.py --platform linkedin

      - name: Commit and Push Assets
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -f images/ state.json posts.json
          git commit -m "Add LinkedIn assets [skip ci]" || echo "No changes"
          git push || echo "Push failed"

      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_URN: ${{ secrets.LINKEDIN_URN }}
        run: python scripts/publish_linkedin.py
