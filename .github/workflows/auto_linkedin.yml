name: Auto LinkedIn Poster

on:
  schedule:
    - cron: "0 17 * * 0,1,3,5" # Sun/Mon/Wed/Fri at 17:00 UTC (4x/week)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare Assets
        id: prepare
        continue-on-error: true
        run: python scripts/prepare_assets.py --platform linkedin

      - name: Retry Prepare Assets
        continue-on-error: true
        if: steps.prepare.conclusion != 'success'
        run: python scripts/prepare_assets.py --platform linkedin

      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_URN }}
        run: python scripts/publish_linkedin.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "Update state.json after LinkedIn post" || true
          git pull --rebase origin master || true
          git push origin master || (sleep 5 && git pull --rebase origin master && git push)
