name: Auto Wilma Bluesky Poster

on:
  schedule:
    - cron: "30 12 * * *" # Daily at 12:30 UTC (4:30 PM GST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish to Bluesky
        env:
          WILMA_BLUESKY_HANDLE: ${{ secrets.WILMA_BLUESKY_HANDLE }}
          WILMA_BLUESKY_PASSWORD: ${{ secrets.WILMA_BLUESKY_PASSWORD }}
        run: python forwilma/publish_wilma_bluesky.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add forwilma/state.json forwilma/images/ forwilma/*.flag || true
          [ -f forwilma/caption.txt ] && git add forwilma/caption.txt || true
          [ -f forwilma/output.jpg ] && git add forwilma/output.jpg || true
          git commit -m "Wilma: Bluesky publish + generated assets [skip ci]" || true
          git stash || true
          git pull --rebase origin master || true
          git stash pop || true
          git push origin master || (sleep 5 && git pull --rebase origin master && git push)
