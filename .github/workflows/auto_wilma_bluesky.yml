name: Auto Wilma Bluesky Poster

on:
  schedule:
    - cron: "15 9 * * *" # Daily at 9:15 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync remote state
        run: git pull --rebase origin master

      - name: Prepare Assets
        run: |
          python scripts/prepare_assets.py --platform bluesky --state_path forwilma/state.json || \
          python scripts/prepare_assets.py --platform bluesky --state_path forwilma/state.json

      - name: Publish to Bluesky
        env:
          WILMA_BLUESKY_HANDLE: ${{ secrets.WILMA_BLUESKY_HANDLE }}
          WILMA_BLUESKY_PASSWORD: ${{ secrets.WILMA_BLUESKY_PASSWORD }}
        run: python forwilma/publish_wilma_bluesky.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add forwilma/state.json
          git commit -m "Update forwilma/state.json after Bluesky post" || true
          git stash || true
          git pull --rebase origin master || true
          git stash pop || true
          git push origin master || (sleep 5 && git pull --rebase origin master && git push)
