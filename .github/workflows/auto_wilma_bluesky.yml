name: Auto Wilma Bluesky Poster

on:
  schedule:
    - cron: "30 12 * * *" # Daily at 12:30 UTC (4:30 PM GST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Sync remote state
        run: git pull --no-rebase origin master

      - name: Prepare Assets
        run: python scripts/prepare_assets.py --platform bluesky --state_path forwilma/state.json

      - name: Publish to Bluesky
        env:
          WILMA_BLUESKY_HANDLE: ${{ secrets.WILMA_BLUESKY_HANDLE }}
          WILMA_BLUESKY_PASSWORD: ${{ secrets.WILMA_BLUESKY_PASSWORD }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: python forwilma/publish_wilma_bluesky.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add -A || true
          git add -f forwilma/output.jpg forwilma/caption.txt || true
          git commit -m "Wilma: Bluesky publish + generated assets [skip ci]" || true
          git push origin master || (sleep 5 && git pull --no-rebase origin master && git checkout --ours forwilma/state.json || true && git add forwilma/state.json && git commit -m "resolve state.json merge" && git push origin master)
