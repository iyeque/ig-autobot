name: Auto Wilma Bluesky Poster

on:
  schedule:
    - cron: "15 9 * * *" # Daily at 9:15 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Wilma assets
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          BOOK_TITLE: "Digital Guardian"
          BOOK_AUTHOR: "Wilma"
        run: python forwilma/wilma_bot.py --mode generate_all

      - name: Publish to Bluesky
        env:
          WILMA_BLUESKY_HANDLE: ${{ secrets.WILMA_BLUESKY_HANDLE }}
          WILMA_BLUESKY_PASSWORD: ${{ secrets.WILMA_BLUESKY_PASSWORD }}
        run: python forwilma/publish_wilma_bluesky.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add forwilma/state.json forwilma/images/ forwilma/*.flag forwilma/caption.txt forwilma/output.jpg
          git commit -m "Wilma: Bluesky publish + generated assets [skip ci]" || true
          git stash || true
          git pull --rebase origin master || true
          git stash pop || true
          git push origin master || (sleep 5 && git pull --rebase origin master && git push)
