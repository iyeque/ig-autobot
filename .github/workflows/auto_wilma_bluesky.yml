name: Auto Wilma Bluesky Poster

on:
  schedule:
    - cron: "30 12 * * *" # Daily at 12:30 UTC (4:30 PM GST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Sync remote state
        run: git pull --no-rebase origin master

      - name: Prepare Assets
        run: python scripts/prepare_assets.py --platform bluesky --state_path forwilma/state.json

      - name: Ensure Wilma queue if missing
        run: |
          if [ ! -s forwilma/state.json ] || [ "$(python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('forwilma/state.json').read_text(encoding='utf-8'))
          print('1' if (state.get('content_queue') or state.get('active_bundle')) else '0')
          PY
          )" = "1" ]; then
            echo 'Wilma queue already has content. Skipping inline generation.'
            exit 0
          fi
          if [ -f .wilma_generated_today ]; then
            echo 'Wilma generator already ran today. Skipping inline generation.'
            exit 0
          fi
          python forwilma/wilma_bot.py --mode generate_all
          date -u +%Y-%m-%d > .wilma_generated_today

      - name: Publish to Bluesky
        env:
          WILMA_BLUESKY_HANDLE: ${{ secrets.WILMA_BLUESKY_HANDLE }}
          WILMA_BLUESKY_PASSWORD: ${{ secrets.WILMA_BLUESKY_PASSWORD }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: python forwilma/publish_wilma_bluesky.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add -A || true
          git add -f forwilma/output.jpg forwilma/caption.txt || true
          git diff --cached --quiet || git stash push -m "wilma-bs-ci" --include-untracked
          git pull --no-rebase origin master
          git stash pop || true
          git add -A || true
          git add -f forwilma/output.jpg forwilma/caption.txt || true
          git diff --cached --quiet || git commit -m "Wilma: Bluesky publish + generated assets [skip ci]" || true
          git push origin master
