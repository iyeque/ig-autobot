name: Wilma Carousel Publisher
on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 5,0'  # Fri+Sun at 15:00 UTC = 19:00 GST

permissions:
  contents: write

concurrency:
  group: wilma-carousel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest
        run: git fetch origin && git reset --hard origin/master

      - name: Clear stale carousel (regenerate fresh every run)
        run: rm -f forwilma/carousel.json

      - name: Publish carousel (LinkedIn)
        env:
          WILMA_LINKEDIN_REFRESH_TOKEN: ${{ secrets.WILMA_LINKEDIN_REFRESH_TOKEN }}
          WILMA_LINKEDIN_CLIENT_ID: ${{ secrets.WILMA_LINKEDIN_CLIENT_ID }}
          WILMA_LINKEDIN_CLIENT_SECRET: ${{ secrets.WILMA_LINKEDIN_CLIENT_SECRET }}
          WILMA_LINKEDIN_URN: ${{ secrets.WILMA_LINKEDIN_URN }}
        run: |
          python scripts/generate_carousel_from_bundle.py --state_path forwilma/state.json --wilma --footer "DIGITAL GUARDIAN | WILMA"
          python scripts/prepare_assets.py --platform linkedin --state_path forwilma/state.json
          python forwilma/publish_wilma_linkedin.py

      - name: Commit state changes
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: wilma carousel state [skip ci]"
          for attempt in 1 2 3; do
            if git push origin master; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt, resolving..."
            git stash --include-untracked 2>/dev/null || true
            git fetch origin
            git reset --hard origin/master
            git stash pop 2>/dev/null || true
            if grep -q '<<<<<<<' forwilma/state.json 2>/dev/null; then
              git checkout --theirs forwilma/state.json 2>/dev/null || true
              git add forwilma/state.json
            fi
            git add -A
            git diff --cached --quiet || git commit -m "chore: wilma carousel state [skip ci] (retry $attempt)"
            sleep 5
          done
          echo "::error::Failed to push after 3 attempts"
          exit 1
