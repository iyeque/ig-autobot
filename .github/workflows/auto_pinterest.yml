name: Auto Pinterest Poster

on:
  schedule:
    - cron: "50 13 * * *" # Daily at 13:50 UTC (5:50 PM GST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare Assets
        run: python scripts/prepare_assets.py --platform pinterest

      - name: Publish to Pinterest
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python scripts/publish_pinterest.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add state.json images/ *.flag carousel.json || true
          git commit -m "Update state/assets after Pinterest post" || true
          git stash || true
          git pull --no-rebase origin master || true
          git stash pop || true
          git push origin master || (sleep 5 && git pull --no-rebase origin master && git push)
