<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HyperFrames Reel Prototype</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <style>
    :root {
      --brand-highlight: #facc15;
      --brand-bg: #0f1115;
      --brand-text: #f8fafc;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--brand-bg);
      color: var(--brand-text);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #root {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg-image {
      position: absolute;
      inset: 0;
      background-image: url("../assets/hero.jpg");
      background-size: cover;
      background-position: center;
      transform: scale(1.0);
      opacity: 0;
      filter: brightness(0.55);
    }

    .content {
      position: relative;
      z-index: 2;
      width: 88%;
      max-width: 960px;
      padding: 24px;
    }

    .highlight-bar {
      position: absolute;
      left: 0;
      width: 6px;
      height: 0%;
      background: var(--brand-highlight);
      border-radius: 2px;
      top: 0;
    }

    .beat {
      position: absolute;
      left: 24px;
      right: 24px;
      opacity: 0;
      transform: translateY(18px);
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      line-height: 1.35;
    }

    .beat-1 {
      top: 12%;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .beat-2 {
      top: 38%;
      font-size: 26px;
      font-weight: 400;
      opacity: 0;
    }

    .beat-3 {
      top: 58%;
      font-size: 22px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .beat-4 {
      top: 75%;
      font-size: 18px;
      font-weight: 500;
      color: #cbd5e1;
    }

    .logo {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 3;
      font-size: 14px;
      letter-spacing: 0.25em;
      opacity: 0;
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="reel-brokenness-3003" data-start="0" data-width="1080" data-height="1920">
    <div class="bg-image" id="bg"></div>

    <div class="highlight-bar" id="highlight"></div>

    <div class="beat beat-1" id="beat1">Stop treating brokenness like a badge.</div>
    <div class="beat beat-2" id="beat2">It's the easiest way to avoid effort.</div>
    <div class="beat beat-3" id="beat3">Kintsugi isn't about the shatter. It's about what you do with the fragments.</div>
    <div class="beat beat-4" id="beat4">Choose repair. Choose function.</div>

    <div class="logo" id="logo">THE NINE STITCHES</div>

    <script>
      const tl = gsap.timeline({ paused: true });

      tl.to("#bg", { opacity: 1, scale: 1.08, duration: 8, ease: "none" }, 0)
        .to("#highlight", { height: "28%", duration: 1.2, ease: "power2.out" }, 0.2)
        .to("#beat1", { opacity: 1, y: 0, duration: 1.1, ease: "power2.out" }, 0.3)
        .to("#beat2", { opacity: 1, y: 0, duration: 1.0, ease: "power2.out" }, 1.6)
        .to("#beat3", { opacity: 1, y: 0, duration: 1.0, ease: "power2.out" }, 3.1)
        .to("#beat4", { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 4.6)
        .to("#logo", { opacity: 0.9, duration: 0.8, ease: "none" }, 7.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["reel-brokenness-3003"] = tl;
    </script>
  </div>
</body>
</html>
