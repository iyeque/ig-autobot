<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bundle-1285</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"><\/script>
  <style>
    :root {
      --brand-highlight: #facc15;
      --brand-bg: #0f1115;
      --brand-text: #f8fafc;
      --caption-bg: rgba(15, 17, 21, 0.55);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--brand-bg);
      color: var(--brand-text);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #root {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bg-image {
      position: absolute;
      inset: 0;
      background-image: url("../assets/bundle-1285.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0;
      filter: brightness(0.55);
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .bg-motion-kenburns { transform: scale(1.0); }
    .bg-motion-slide_up { transform: translateY(40px); opacity: 0.5; }
    .bg-motion-fade_in {}
    .bg-motion-typewriter { transform: scale(1.0); }
    .bg-motion-parallax { transform: scale(1.04); }
    .content {
      position: relative;
      z-index: 2;
      width: 88%;
      max-width: 960px;
      padding: 24px;
    }
    .highlight-bar {
      position: absolute;
      left: 0;
      width: 6px;
      height: 0%;
      background: var(--brand-highlight);
      border-radius: 2px;
      top: 0;
    }
    .beat {
      position: absolute;
      left: 24px;
      right: 24px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      line-height: 1.35;
    }
    .logo {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 3;
      font-size: 14px;
      letter-spacing: 0.25em;
      opacity: 0;
      color: #f8fafc;
    }
    
    .caption-rail {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      background: var(--caption-bg);
      padding: 18px 24px;
      backdrop-filter: blur(6px);
    }
    .caption-rail p {
      margin: 0;
      font-size: 20px;
      line-height: 1.6;
      color: #e2e8f0;
    }
    
  </style>
</head>
<body>
  <div id="root" data-composition-id="bundle-1285" data-start="0" data-width="1080" data-height="1920" data-duration="10">
    <div class="bg-image bg-motion-kenburns" id="bg"></div>
    <div class="highlight-bar" id="highlight"></div>
    
    <div class="beat beat-1" id="beat1" style="top:8.0%; font-size:44px; font-weight:700; opacity:0; transform: translateY(18px);">Ah, yes. Heraclitus's ancient whopper: panta rhei -</div>
    
    <div class="beat beat-2" id="beat2" style="top:20.8%; font-size:30px; font-weight:400; opacity:0; transform: translateY(18px);">everything flows. The Greek philosopher probably said it</div>
    
    <div class="beat beat-3" id="beat3" style="top:33.6%; font-size:30px; font-weight:400; opacity:0; transform: translateY(18px);">while watching a river, which sounds pretentious until</div>
    
    <div class="beat beat-4" id="beat4" style="top:46.4%; font-size:30px; font-weight:400; opacity:0; transform: translateY(18px);">you realize he was right about literally everything.</div>
    
    <div class="beat beat-5" id="beat5" style="top:59.2%; font-size:30px; font-weight:400; opacity:0; transform: translateY(18px);">We spend our twenties mortgaging our futures to</div>
    
    <div class="beat beat-6" id="beat6" style="top:72.0%; font-size:30px; font-weight:400; opacity:0; transform: translateY(18px);">buy houses that will depreciate while we appreciate</div>
    
    <div class="logo" id="logo">THE NINE STITCHES</div>
    
    <div class="caption-rail">
      <p>Ah, yes. Heraclitus's ancient whopper: panta rhei - everything flows. The Greek philosopher probably said it while watching a river, which sounds pretentious until you realize h...</p>
    </div>
    
    
    <script>
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', registerTimeline);
      } else {
        registerTimeline();
      }
      function registerTimeline() {
        const tl = gsap.timeline({ paused: true });
        tl.to("#bg", { scale: 1.08, duration: 10, ease: "none" }, 0)
        tl.to("#highlight", { height: "28%", duration: 1.12, ease: "power2.out" }, 0.2)
        
        tl.to("#beat1", { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 0.8)
        
        tl.to("#beat2", { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 2.05)
        
        tl.to("#beat3", { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 3.3)
        
        tl.to("#beat4", { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 4.55)
        
        tl.to("#beat5", { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 5.8)
        
        tl.to("#beat6", { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 7.05)
        
        tl.to("#logo", { opacity: 0.9, duration: 0.8, ease: "none" }, 8.3);
        window.__timelines = window.__timelines || {};
        window.__timelines["bundle-1285"] = tl;
      }
    <\/script>
  </div>
</body>
</html>
